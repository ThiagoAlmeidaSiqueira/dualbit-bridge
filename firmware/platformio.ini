;
; DualBit Bridge — Firmware ESP32
; ---------------------------------------------------------------------
; Requer ESP32 "clássico" (Bluetooth Classic). NÃO funciona em ESP32-S2,
; ESP32-S3, ESP32-C3 ou ESP32-C6 (sem BT Classic).
;
; Compile/grave com:  pio run -t upload
; Monitore o console: pio device monitor
;

[env:esp32dev]
platform = espressif32@6.9.0   ; Arduino-ESP32 2.0.x (compatível com a lib PS4)
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; O app com Bluetooth Classic fica grande: usamos 3 MB para a aplicação
board_build.partitions = huge_app.csv

lib_deps =
    https://github.com/aed3/PS4-esp32.git

build_flags =
    ; 0 = sem pacote de sensores (padrão). Veja docs/PROTOCOL.md antes
    ; de mudar para 1: exige patch no parser da biblioteca PS4.
    -DDUALBIT_ENABLE_MOTION=0
    -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------------
; Variante para ESP32 DevKit com 4 MB (mesma coisa, apenas explícito)
; ---------------------------------------------------------------------
[env:esp32dev_4mb]
extends = env:esp32dev
board_upload.flash_size = 4MB
